<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual — Ingeniería de Sistemas</title>
  <style>
    body { margin: 0; background: #05070d; color: #f7f8ff; font-family: Inter, system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .loading { text-align: center; }
    .loading span { display: inline-block; width: 12px; height: 12px; margin: 0 4px; border-radius: 50%; background: linear-gradient(135deg, #7c5cff, #00d1ff); animation: bounce 1.2s infinite; }
    .loading span:nth-child(2) { animation-delay: 0.15s; }
    .loading span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="loading">
    <p style="font-weight: 700; margin-bottom: 1rem;">Cargando Biblioteca Virtual...</p>
    <div><span></span><span></span><span></span></div>
  </div>
</body>
</html>
